<!--
  Source for the extension's PNG icons: a faded word struck through, on a
  toned-down red tile – the same strike-through the menu uses for hidden
  items. Edges sit on multiples of 8 in this 128 grid so they land on whole
  pixels at 16, 32 and 48px. The 128px store icon is rendered with extra
  padding (see scripts/render-icons.mjs).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#d4434f"/>
  <rect x="32" y="48" width="64" height="32" rx="16" fill="#fff" fill-opacity="0.45"/>
  <rect x="16" y="64" width="96" height="8" rx="4" fill="#fff"/>
</svg>
